<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rest: Circuits</title>
    <style>
      :root {
        --bg: #0b0f17;
        --ink: #e8e2d0;
        --ink-dim: #a9a291;
        --panel: rgba(16, 22, 34, 0.88);
        --edge: #3a4256;
        --lit: #f2c35b;
        --dark: #6b7385;
        --alarm: #ff6b5b;
        --focus: #8fd3ff;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }

      /* Overlay: transparent to the pointer except its own controls, so the canvas still gets clicks. */
      #ui { position: absolute; inset: 0; pointer-events: none; font-size: 15px; }
      #ui button, #ui select { pointer-events: auto; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 6px 10px; }
      #ui button:hover, #ui select:hover { border-color: var(--ink-dim); }
      #ui button:focus-visible, #ui select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

      .hud { position: absolute; top: 16px; display: flex; flex-direction: column; gap: 10px; max-width: min(360px, calc(100% - 32px)); }
      .hud-left { left: 16px; }
      .hud-right { right: 16px; align-items: flex-end; }
      .picker { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
      .readout, .targets { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; }
      .capacity { font-variant-numeric: tabular-nums; font-weight: 600; }
      .capacity.brownout { color: var(--alarm); border-color: var(--alarm); }
      .label { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-dim); }
      .targets { list-style: none; margin: 0; display: flex; flex-direction: column; gap: 4px; }
      .target { display: flex; align-items: center; gap: 8px; }
      .mark { display: inline-block; min-width: 3.2em; text-align: center; border-radius: 4px; padding: 1px 4px; font-size: 12px; border: 1px solid var(--edge); }
      .target.lit .mark { background: var(--lit); color: #1a1408; border-color: var(--lit); }
      .target.dark .mark { color: var(--ink-dim); }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; pointer-events: auto; }
      .banner { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--lit); color: var(--lit); border-radius: 8px; padding: 10px 16px; max-width: calc(100% - 32px); text-align: center; }
      /* Placed beside the pointer by src/ui/index.ts (left/top are set from the script). */
      .prompt { position: absolute; left: 0; top: 0; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 14px; max-width: min(320px, calc(100% - 16px)); }

      /* At 600 px and below the action buttons are icon-only squares; the picker stops short of them (3 × 40 px + 2 × 6 px gaps + 12 px before Download log + 8 px margin = 152 px). */
      @media (max-width: 600px) {
        .hud-left { left: 8px; right: 152px; max-width: none; }
        .hud-right { left: auto; right: 8px; }
        .picker select { min-width: 0; max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="panel" aria-label="Power map. Use the buttons and map picker to play."></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
