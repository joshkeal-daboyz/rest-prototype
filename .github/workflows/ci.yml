name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The whole suite, on demand (Actions tab > CI > Run workflow): for a release or when Josh asks.
  workflow_dispatch:
    inputs:
      cities:
        description: "Whole-city checks run on: all (the 20 named cities) or one (6 x 6 seed 1)"
        type: choice
        default: all
        options: [all, one]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Josh, 23 Nov 2026: tests only against what a change directly impacts (docs/test-policy.md).
      # A PR runs the tests whose imports reach a file it changed; a push to main, those the push reached.
      # Vitest runs everything when package.json or the vite config changed. A manual run is the whole suite.
      - name: Tests the change reaches
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before || '') }}
        run: |
          if [ -z "$BASE" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.cities }}" != "one" ]; then
              npx vitest run --mode full
            else
              npm test
            fi
          else
            npx vitest run --changed "$BASE"
          fi
